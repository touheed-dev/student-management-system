<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f7;
        }

        .login-container {
            width: 380px;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4a73e8;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #4a73e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #365dcc;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: #4a73e8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Student Login</h1>
        <p class="subtitle">Student Management System</p>

        <form id="loginForm">

            <label for="studentId">Student ID</label>
            <input
                type="text"
                id="studentId"
                placeholder="Enter your Student ID"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>

        <div class="register-link">
            Don't have an account?
            <a href="registration.html">Register here</a>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const studentId = document.getElementById("studentId").value.trim();
            const password = document.getElementById("password").value.trim();
            const message = document.getElementById("message");

            if (studentId === "" || password === "") {
                message.textContent = "Please enter Student ID and password.";
                message.style.color = "red";
                return;
            }

            message.textContent = "Login successful!";
            message.style.color = "green";
        });
    </script>

</body>
</html>
